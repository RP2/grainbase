# cargo-deny configuration for grainbase.
# Reference schema: https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# [advisories] — RustSec vulnerability database.
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Transitive advisories are reported by default; keep that surface visible.
ignore = []

# ---------------------------------------------------------------------------
# [licenses] — deny by default, allow only the listed set.
# The list is permissive but bounded: every crate must declare an explicit,
# SPDX-style license the way cargo-deny can match. Add new exceptions here,
# not as blanket ignores.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8
# Warn on allow-listed-but-unused licenses so we can prune the list over time.
unused-allowed-license = "warn"

# Workspace members are not published and therefore have no published SPDX
# license string for cargo-deny to match. Suppress the per-crate check.
[licenses.private]
ignore = true

# Scoped exception for the LGPL-2.1 dependency `rawler` (ADR 0001).
#
# rawler 0.8.0 declares the DEPRECATED bare identifier `license = "LGPL-2.1"`
# in its Cargo.toml, not `LGPL-2.1-only`. cargo-deny matches GNU identifiers
# pedantically, so the string below must be the exact one rawler uses — using
# `LGPL-2.1-only` here does NOT match. Verified against rawler 0.8.0.
#
# Semantically `LGPL-2.1` means "2.1 only". LGPL-2.1 permits linking into an
# AGPL-3.0 work provided the combined terms allow the user to modify the work
# and reverse-engineer for debugging; AGPL does. The practical relink route in
# Rust is shipping full source, which this project already does. Re-check on
# every rawler bump: the string may change to a non-deprecated form.
[[licenses.exceptions]]
crate = "rawler"
allow = ["LGPL-2.1"]

# ---------------------------------------------------------------------------
# [bans] — duplicate and wildcard version control.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"   # Promote to "deny" once the tree is unique.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# [sources] — only first-party code and crates.io.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
