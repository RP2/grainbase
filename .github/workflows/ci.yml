name: ci

# Triggers: every push to main, every pull request (any branch).
#
# Add `[skip ci]` to a commit message to skip this on that push: GitHub honours
# it for push and pull_request events. Useful for work-in-progress pushes where
# you already ran the checks locally.
on:
  push:
    branches: [main]
  pull_request:

# Workflow-scoped defaults: lock permissions down to the read-only floor,
# then opt jobs back in only when they need to write (none of these do).
permissions: {}

# Cancel superseded runs on the same ref, so pushing twice in a row does not
# leave the first run burning a runner to no purpose.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # --- Static checks -----------------------------------------------------------
  # One job, not four. fmt, clippy and doc share a checkout, a toolchain and a
  # warm cache, and none of them is slow enough to be worth a separate runner.
  # `--keep-going` style separation buys clearer signals at 4x the setup cost,
  # which is the wrong trade while this is pre-alpha.
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
      # Promotes any rustc warning to an error. The clippy line deliberately
      # does NOT use `-- -D warnings`, which would invalidate the build cache.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features

  # --- Tests -------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo test --workspace --locked

  # --- MSRV --------------------------------------------------------------------
  # Separate because it needs a different toolchain: `rust-toolchain.toml` pins
  # what we DEVELOP on, while `rust-version` in Cargo.toml declares the oldest
  # toolchain we SUPPORT.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      - run: cargo hack check --rust-version --workspace --all-targets --ignore-private
