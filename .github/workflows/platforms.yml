name: platforms

# Cross-platform tests on every push to main and on demand.
#
# macOS runners are slow and this project has no release yet; move `test`
# back into ci.yml when there is something to ship, so release builds are
# gated on every platform.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo test --workspace --locked
