[workspace]
resolver = "3"
members = [
    "crates/grainbase",
    "crates/grainbase-cli",
]

# Shared package metadata. Members inherit these so a single edit propagates.
[workspace.package]
version = "0.0.0"
edition = "2024"
# The OLDEST toolchain we support, not the newest. Lowering this is a
# compatibility promise; raising it is a breaking change for users on older
# Rust. The binding constraint is rawler, which declares 1.89 (edition 2024
# itself needs 1.85). Declaring today's stable here would make any runner one
# release behind fail outright, which is not a support policy.
# CI verifies this floor with `cargo hack check --rust-version`.
rust-version = "1.89"
license = "AGPL-3.0-or-later"

# Workspace-wide lints. Each crate must opt in with [lints] workspace = true
# because Cargo does not inherit lints implicitly.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

# Internal crates are declared here so members depend on them by name and the
# version is pinned. A bare `path` dependency is a wildcard and `cargo deny`
# rejects it; the version also makes the crates publishable later.
[workspace.dependencies]
grainbase = { path = "crates/grainbase", version = "0.0.0" }
